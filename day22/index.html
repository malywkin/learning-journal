<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День 22 — RAG-запрос: стеклянный ящик</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --ink:#e8edf2; --dim:#95a1ad;
    --line:#2a323c; --accent:#6ea8fe; --good:#5fd0a0; --warn:#e0b455; --bad:#e07a7a;
  }
  *{box-sizing:border-box}
  body{margin:0; background:radial-gradient(1100px 640px at 72% -12%,#1a2230,#0f1216 60%);
    color:var(--ink); font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1120px; margin:0 auto; padding:22px 22px 60px}
  .kicker{color:var(--accent); font-weight:600; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase}
  h1{margin:.1em 0 .1em; font-size:24px}
  .sub{color:var(--dim); font-size:14px; margin-bottom:18px}
  .ask{display:flex; gap:10px; margin-bottom:8px}
  input[type=text]{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:11px; padding:13px 15px; font-size:15px}
  input[type=text]:focus{outline:none; border-color:var(--accent)}
  button{background:var(--accent); color:#0b1017; border:none; border-radius:11px; padding:13px 20px;
    font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap}
  button:hover{filter:brightness(1.08)} button:disabled{opacity:.4; cursor:default}
  button.ghost{background:var(--panel2); color:var(--ink); border:1px solid var(--line)}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin:2px 0 20px}
  .chip{background:var(--panel2); border:1px solid var(--line); color:var(--dim); border-radius:20px;
    padding:6px 12px; font-size:12.5px; cursor:pointer}
  .chip:hover{color:var(--ink); border-color:var(--accent)}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; min-height:90px}
  .card h3{margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:8px}
  .tag{font-size:11px; padding:2px 9px; border-radius:20px; border:1px solid var(--line)}
  .tag.norag{color:var(--warn); border-color:#4a3f24; background:#241f12}
  .tag.rag{color:var(--good); border-color:#244a3a; background:#12241c}
  .ans{white-space:pre-wrap; font-size:14px}
  .muted{color:var(--dim)}
  .spin{color:var(--dim); font-size:13px}
  .badge{display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:6px; margin-right:6px}
  .badge.ok{background:#12241c; color:var(--good); border:1px solid #244a3a}
  .badge.no{background:#231316; color:var(--bad); border:1px solid #4a2a2c}
  .cite{color:var(--good); font-weight:600}
  .chunks{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .chunk{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px}
  .chunk .top{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:4px}
  .chunk .src{color:var(--accent); font-weight:600}
  .chunk .txt{font-size:12.5px; color:#c4ccd4}
  .cos{font-variant-numeric:tabular-nums}
  details{margin-top:12px} summary{cursor:pointer; color:var(--accent); font-size:13px}
  pre{background:#0c1015; border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto;
    font-size:12px; color:#cfe0ff; white-space:pre-wrap; margin-top:8px}
  .section{margin-top:34px}
  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
  th,td{text-align:left; padding:8px 9px; border-bottom:1px solid var(--line)}
  th{color:var(--dim); font-weight:600; font-size:12px}
  td.c{text-align:center; font-variant-numeric:tabular-nums}
  .yes{color:var(--good)} .no{color:var(--dim)}
  .trap td{background:#161119}
  .sumline{margin-top:12px; font-size:14px}
  .sumline b{color:var(--good)}
  svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">День 22 · RAG-запрос · стеклянный ящик поверх Дня 21</div>
  <h1>Вопрос → книга → ответ</h1>
  <div class="sub">Один вопрос, два режима бок о бок. Под RAG-ответом видно, какие куски книги он реально получил.</div>

  <div class="ask">
    <input id="q" type="text" placeholder="Спроси про сон младенца… или что-то вне книги — проверить честный отказ"
           value="В какой позе безопаснее всего укладывать младенца спать?">
    <button id="go">Спросить</button>
  </div>
  <div class="chips" id="chips"></div>

  <div class="cols">
    <div class="card">
      <h3><span>Без RAG</span> <span class="tag norag">по памяти</span></h3>
      <div id="plain" class="ans muted">—</div>
    </div>
    <div class="card">
      <h3><span>С RAG</span> <span class="tag rag">по книге</span></h3>
      <div id="ragBadges"></div>
      <div id="rag" class="ans muted">—</div>
      <div id="chunks"></div>
      <div id="promptBox"></div>
    </div>
  </div>

  <div class="section">
    <button class="ghost" id="golden">Прогнать 10 контрольных вопросов →</button>
    <span class="spin" id="gspin"></span>
    <div id="goldenBox"></div>
  </div>
</div>

<script>
const SAMPLES = [
  "Опасно ли спать с младенцем в одной кровати?",
  "Какой должна быть поверхность для сна младенца?",
  "Что делать, если ребёнок лучше спит на животе?",
  "Какая сейчас ставка по ипотеке?",   // вне книги
];
const chips = document.getElementById('chips');
SAMPLES.forEach(s=>{const c=document.createElement('span');c.className='chip';c.textContent=s;
  c.onclick=()=>{document.getElementById('q').value=s; ask()}; chips.appendChild(c)});

function highlightCites(t){ return t.replace(/\[Источник\s*\d+\]/g, m=>`<span class="cite">${m}</span>`); }

async function ask(){
  const q=document.getElementById('q').value.trim(); if(!q) return;
  const go=document.getElementById('go'); go.disabled=true; go.textContent='…';
  document.getElementById('plain').innerHTML='<span class="spin">думает по памяти…</span>';
  document.getElementById('rag').innerHTML='<span class="spin">ищет в книге и отвечает…</span>';
  document.getElementById('ragBadges').innerHTML='';
  document.getElementById('chunks').innerHTML='';
  document.getElementById('promptBox').innerHTML='';
  try{
    const r=await fetch('/api/ask?q='+encodeURIComponent(q)); const d=await r.json();
    document.getElementById('plain').className='ans'; document.getElementById('plain').textContent=d.plain;
    const rag=d.rag;
    document.getElementById('rag').className='ans';
    document.getElementById('rag').innerHTML=highlightCites(rag.answer);
    // бейджи
    let b='';
    b += rag.abstained ? '<span class="badge ok">честный отказ</span>'
                       : '<span class="badge ok">ответил по книге</span>';
    b += `<span class="badge ${rag.top_cos>=0.5?'ok':'no'}">близость топ-куска ${rag.top_cos}</span>`;
    if(rag.citations.invalid.length) b+=`<span class="badge no">выдуманные ссылки: ${rag.citations.invalid.join(',')}</span>`;
    document.getElementById('ragBadges').innerHTML=b;
    // куски
    let ch='<div class="chunks"><div class="muted" style="font-size:12px;margin-bottom:6px">Какие куски книги получил RAG (в порядке близости):</div>';
    rag.chunks.forEach((c,i)=>{ ch+=`<div class="chunk"><div class="top"><span class="src">[Источник ${i+1}] ${c.section}</span><span class="cos">близость ${c.cos}</span></div><div class="txt">${c.text.slice(0,220)}…</div></div>`; });
    ch+='</div>'; document.getElementById('chunks').innerHTML=ch;
    // промпт
    document.getElementById('promptBox').innerHTML=
      `<details><summary>Показать собранный augmented-промпт (что ушло модели)</summary><pre>${rag.prompt_preview.replace(/</g,'&lt;')}</pre></details>`;
  }catch(e){ document.getElementById('rag').innerHTML='<span class="badge no">ошибка: '+e+'</span>'; }
  go.disabled=false; go.textContent='Спросить';
}
document.getElementById('go').onclick=ask;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});

const M = b => b ? '<span class="yes">✓</span>' : '<span class="no">·</span>';
async function golden(){
  const btn=document.getElementById('golden'), sp=document.getElementById('gspin');
  btn.disabled=true; sp.textContent='гоняю 10 вопросов через модель, это ~1–2 минуты…';
  try{
    const r=await fetch('/api/golden'); const d=await r.json();
    let h='<table><tr><th>вопрос</th><th>близость</th><th>нашёл</th><th>оперся</th><th>совпал</th><th>итог</th></tr>';
    d.rows.forEach(x=>{
      h+=`<tr class="${x.in_base?'':'trap'}"><td>${x.q}</td><td class="c">${x.top_cos.toFixed(2)}</td>`+
         `<td class="c">${M(x.relevant)}</td><td class="c">${M(x.faithful)}</td><td class="c">${M(x.hit)}</td>`+
         `<td class="c">${x.ok?'<span class="yes">OK</span>':'<span class="no">FAIL</span>'} ${x.in_base?'':'<span class="muted">вне</span>'}</td></tr>`;
    });
    h+='</table>';
    const s=d.summary;
    h+=`<div class="sumline">Итог: <b>${s.passed}/${s.total}</b> прошли эталон · в базе ${s.in_base_ok}/${s.in_base_total} · честный отказ на ловушках ${s.trap_ok}/${s.trap_total}</div>`;
    document.getElementById('goldenBox').innerHTML=h;
  }catch(e){ document.getElementById('goldenBox').innerHTML='<div class="badge no">ошибка: '+e+'</div>'; }
  btn.disabled=false; sp.textContent='';
}
document.getElementById('golden').onclick=golden;

ask();  // сразу прогоняем стартовый вопрос
</script>
</body>
</html>
