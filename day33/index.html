<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поддержка «Поток»</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#6b7484; --line:#e6e9ef;
    --user:#eef2ff; --userink:#1e2a5a; --accent:#3b5bdb;
    --faq:#2563eb; --faq-bg:#e8f0fe; --crm:#7c3aed; --crm-bg:#f1e9fe; --human:#c2410c; --human-bg:#fde7db;
    --code:#0f1626; --codeink:#e6edf3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1116; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --line:#2a313c;
      --user:#1b2340; --userink:#cdd9ff; --accent:#5b7bff;
      --faq-bg:#152238; --crm-bg:#241633; --human-bg:#3a1f10; --code:#0b0f16; --codeink:#e6edf3; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh}
  header{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}
  header h1 b{color:var(--accent)}
  header .legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--muted)}
  header .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.faq{background:var(--faq)} .dot.crm{background:var(--crm)} .dot.human{background:var(--human)}

  /* панель «кто пишет» */
  .who{padding:9px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .who select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink)}
  .badge{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;
    background:var(--crm-bg);color:var(--crm)}
  .who .tk{color:var(--muted);font-size:12px}

  #chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
  .wrap{max-width:820px;width:100%;margin:0 auto}
  .row{display:flex;flex-direction:column;gap:6px}
  .row.user{align-items:flex-end}
  .bubble{padding:11px 15px;border-radius:14px;max-width:88%}
  .user .bubble{background:var(--user);color:var(--userink);border-bottom-right-radius:4px}
  .bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}

  .trace{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    font-size:12px;font-weight:550;border:1px solid transparent}
  .pill.faq{color:var(--faq);background:var(--faq-bg)} .pill.crm{color:var(--crm);background:var(--crm-bg)}
  .pill.human{color:var(--human);background:var(--human-bg)}
  .pill svg{width:13px;height:13px}
  .pill .arg{opacity:.7;font-weight:450}
  .meta{font-size:11px;color:var(--muted);margin-top:3px}

  /* markdown */
  .md h1,.md h2,.md h3{margin:.7em 0 .35em;line-height:1.3}
  .md h1{font-size:1.25em} .md h2{font-size:1.13em} .md h3{font-size:1.02em}
  .md p{margin:.5em 0} .md ul,.md ol{margin:.4em 0;padding-left:1.4em} .md li{margin:.15em 0}
  .md code{background:rgba(130,140,160,.16);padding:1px 5px;border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
  .md pre{background:var(--code);color:var(--codeink);padding:12px 14px;border-radius:9px;
    overflow-x:auto;margin:.6em 0} .md pre code{background:none;padding:0;color:inherit}
  .md blockquote{margin:.5em 0;padding:.2em 0 .2em 12px;border-left:3px solid var(--line);color:var(--muted)}
  .md table{border-collapse:collapse;margin:.6em 0;font-size:.93em;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}
  .md th{background:rgba(130,140,160,.10)} .md hr{border:none;border-top:1px solid var(--line);margin:.8em 0}

  .typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25} 30%{opacity:1}}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px}
  .inbar{max-width:820px;margin:0 auto;display:flex;gap:10px}
  #q{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);
    color:var(--ink);font:inherit;resize:none;max-height:120px}
  #q:focus{outline:none;border-color:var(--accent)}
  #send{border:none;background:var(--accent);color:#fff;padding:0 18px;border-radius:11px;
    font-weight:600;cursor:pointer} #send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Поддержка <b>«Поток»</b></h1>
  <div class="legend">
    <span><i class="dot faq"></i>FAQ</span>
    <span><i class="dot crm"></i>тикет (MCP)</span>
    <span><i class="dot human"></i>оператор</span>
  </div>
</header>

<div class="who">
  <span>Кто пишет:</span>
  <select id="who"></select>
  <span class="badge" id="plan">—</span>
  <span class="tk" id="tk"></span>
</div>

<div id="chat"><div class="wrap" id="stream"></div></div>

<footer>
  <div class="inbar">
    <textarea id="q" rows="1" placeholder="Вопрос от лица клиента… (Enter — отправить, Shift+Enter — перенос)"></textarea>
    <button id="send">Отправить</button>
  </div>
</footer>

<script>
const stream = document.getElementById('stream');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
const whoSel = document.getElementById('who');
const planEl = document.getElementById('plan');
const tkEl = document.getElementById('tk');
let history = [];
let personas = [];

const ICON = {
  faq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h7M8 17h5"/></svg>',
  crm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 9v10"/></svg>',
  human:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>'
};

// ── компактный markdown → HTML (self-contained, без внешних библиотек) — реюз Дня 31 ──
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,(_,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<i>$1</i>');
}
function md(src){
  const lines = src.replace(/\r/g,'').split('\n');
  let html='', i=0, guard=0;
  while(i<lines.length){
    if(++guard > 20000) break;
    let ln=lines[i];
    if(ln.startsWith('```')){
      const lang=ln.slice(3); i++; let buf=[];
      while(i<lines.length && !lines[i].startsWith('```')){buf.push(lines[i]); i++;}
      i++; html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head=ln.split('|').slice(1,-1).map(c=>c.trim());
      i+=2; let body=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        body.push(lines[i].split('|').slice(1,-1).map(c=>c.trim())); i++;
      }
      html+='<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    let m;
    if(m=ln.match(/^(#{1,3})\s+(.*)$/)){html+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>'; i++; continue;}
    if(/^\s*(---|\*\*\*)\s*$/.test(ln)){html+='<hr>'; i++; continue;}
    if(/^\s*>\s?/.test(ln)){
      let buf=[]; while(i<lines.length && /^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;}
      html+='<blockquote>'+md(buf.join('\n'))+'</blockquote>'; continue;
    }
    if(/^\s*[-*]\s+/.test(ln)){
      let buf=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++;}
      html+='<ul>'+buf.join('')+'</ul>'; continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      let buf=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++;}
      html+='<ol>'+buf.join('')+'</ol>'; continue;
    }
    if(ln.trim()===''){i++; continue;}
    let buf=[lines[i]]; i++;
    const stop=/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>\s|```|\s*\|.*\|)/;
    while(i<lines.length && lines[i].trim()!=='' && !stop.test(lines[i])){buf.push(lines[i]); i++;}
    html+='<p>'+inline(buf.join(' '))+'</p>';
  }
  return html;
}

function scrollDown(){document.getElementById('chat').scrollTop=1e9;}

function addUser(text){
  const row=document.createElement('div'); row.className='row user wrap';
  row.innerHTML='<div class="bubble">'+esc(text).replace(/\n/g,'<br>')+'</div>';
  stream.appendChild(row); scrollDown();
}
function traceHtml(trace){
  if(!trace||!trace.length) return '';
  let pills='';
  trace.forEach(t=>{
    const a = t.args||{};
    const arg = a.query || a.ticket_id || a.reason || a.query || '';
    pills += '<span class="pill '+t.kind+'">'+ICON[t.kind]+t.label+
      (arg?' <span class="arg">'+esc(String(arg).slice(0,40))+'</span>':'')+'</span>';
  });
  return '<div class="trace">'+pills+'</div>';
}
function addBot(res){
  const row=document.createElement('div'); row.className='row bot wrap';
  let body;
  try{ body=md(res.answer||''); }
  catch(e){ body='<p>'+esc(res.answer||'')+'</p>'; }
  row.innerHTML = traceHtml(res.trace)+'<div class="bubble"><div class="md">'+body+'</div>'+
    '<div class="meta">модель: '+(res.provider||'—')+'</div></div>';
  stream.appendChild(row); scrollDown();
}
function addTyping(){
  const row=document.createElement('div'); row.className='row bot wrap'; row.id='typing';
  row.innerHTML='<div class="bubble"><span class="typing">думаю<i></i><i></i><i></i></span></div>';
  stream.appendChild(row); scrollDown(); return row;
}

function curTicket(){ return whoSel.value; }

async function ask(text){
  addUser(text); history.push({role:'user',content:text});
  qEl.value=''; qEl.style.height='auto'; sendBtn.disabled=true;
  const typing=addTyping();
  let res;
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:text,history,ticket_id:curTicket()})});
    res=await r.json();
  }catch(e){ res={answer:'Не удалось связаться с сервером: '+e,trace:[],provider:'none'}; }
  typing.remove(); addBot(res);
  if(res.answer) history.push({role:'assistant',content:res.answer});
  sendBtn.disabled=false; qEl.focus();
}

// демо-сценарии: клик по кнопке ставит нужного клиента И задаёт вопрос
const DEMO = [
  {t:'T-2041', q:'Почему не работает авторизация?'},
  {t:'T-2042', q:'С меня дважды списали — верните деньги'},
  {t:'T-2043', q:'Заметки не синхронизируются между телефоном и ноутбуком'},
  {t:'T-2044', q:'Как повысить тариф до Team?'},
  {t:'T-2045', q:'Есть ли у вас интеграция с Notion?'}
];

function selectPersona(ticket){
  whoSel.value=ticket;
  const p=personas.find(x=>x.ticket_id===ticket)||{};
  planEl.textContent=p.plan||'—';
  tkEl.textContent=p.ticket_id? ('тикет '+p.ticket_id+' · '+p.subject):'';
}

function welcome(){
  const row=document.createElement('div'); row.className='row bot wrap';
  row.innerHTML='<div class="bubble"><div class="md">'+md(
    'Здравствуйте! Я ассистент поддержки сервиса **«Поток»**. Отвечаю на вопросы о продукте, '+
    'смотрю ваш тикет и, если нужно, зову живого оператора.\n\nВыберите клиента вверху или нажмите сценарий:')+
    '</div><div class="chips" id="chips"></div></div>';
  stream.appendChild(row);
  const c=row.querySelector('#chips');
  DEMO.forEach(d=>{const b=document.createElement('div'); b.className='chip';
    const p=personas.find(x=>x.ticket_id===d.t)||{};
    b.textContent=(p.name? p.name.split(' ')[0]+': ':'')+d.q;
    b.onclick=()=>{ selectPersona(d.t); ask(d.q); }; c.appendChild(b);});
}

async function boot(){
  try{ personas=await (await fetch('/personas')).json(); }catch(e){ personas=[]; }
  whoSel.innerHTML='';
  personas.forEach(p=>{const o=document.createElement('option'); o.value=p.ticket_id;
    o.textContent=p.name+' · '+p.plan; whoSel.appendChild(o);});
  whoSel.onchange=()=>{ selectPersona(whoSel.value); history=[]; };
  if(personas.length) selectPersona(personas[0].ticket_id);
  welcome(); qEl.focus();
}

qEl.addEventListener('input',()=>{qEl.style.height='auto'; qEl.style.height=Math.min(qEl.scrollHeight,120)+'px';});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); if(qEl.value.trim())ask(qEl.value.trim());}});
sendBtn.onclick=()=>{if(qEl.value.trim())ask(qEl.value.trim());};
boot();
</script>
</body>
</html>
