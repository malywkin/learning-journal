<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ассистент разработчика — learning-journal</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#6b7484; --line:#e6e9ef;
    --user:#eef2ff; --userink:#1e2a5a; --accent:#3b5bdb;
    --rag:#2563eb; --rag-bg:#e8f0fe; --mcp:#7c3aed; --mcp-bg:#f1e9fe; --sys:#0f9d58; --sys-bg:#e6f6ec;
    --code:#0f1626; --codeink:#e6edf3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1116; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --line:#2a313c;
      --user:#1b2340; --userink:#cdd9ff; --accent:#5b7bff;
      --rag-bg:#152238; --mcp-bg:#241633; --sys-bg:#0f2a1c; --code:#0b0f16; --codeink:#e6edf3; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:13px}
  header .legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted)}
  header .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.rag{background:var(--rag)} .dot.mcp{background:var(--mcp)} .dot.sys{background:var(--sys)}

  #chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
  .wrap{max-width:820px;width:100%;margin:0 auto}
  .row{display:flex;flex-direction:column;gap:6px}
  .row.user{align-items:flex-end}
  .bubble{padding:11px 15px;border-radius:14px;max-width:88%}
  .user .bubble{background:var(--user);color:var(--userink);border-bottom-right-radius:4px}
  .bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}

  .trace{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    font-size:12px;font-weight:550;border:1px solid transparent}
  .pill.rag{color:var(--rag);background:var(--rag-bg)} .pill.mcp{color:var(--mcp);background:var(--mcp-bg)}
  .pill.sys{color:var(--sys);background:var(--sys-bg)}
  .pill svg{width:13px;height:13px}
  .pill .arg{opacity:.7;font-weight:450}
  .meta{font-size:11px;color:var(--muted);margin-top:3px}

  /* markdown */
  .md h1,.md h2,.md h3{margin:.7em 0 .35em;line-height:1.3}
  .md h1{font-size:1.25em} .md h2{font-size:1.13em} .md h3{font-size:1.02em}
  .md p{margin:.5em 0} .md ul,.md ol{margin:.4em 0;padding-left:1.4em} .md li{margin:.15em 0}
  .md code{background:rgba(130,140,160,.16);padding:1px 5px;border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
  .md pre{background:var(--code);color:var(--codeink);padding:12px 14px;border-radius:9px;
    overflow-x:auto;margin:.6em 0} .md pre code{background:none;padding:0;color:inherit}
  .md blockquote{margin:.5em 0;padding:.2em 0 .2em 12px;border-left:3px solid var(--line);color:var(--muted)}
  .md table{border-collapse:collapse;margin:.6em 0;font-size:.93em;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}
  .md th{background:rgba(130,140,160,.10)} .md hr{border:none;border-top:1px solid var(--line);margin:.8em 0}

  .typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25} 30%{opacity:1}}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px}
  .inbar{max-width:820px;margin:0 auto;display:flex;gap:10px}
  #q{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);
    color:var(--ink);font:inherit;resize:none;max-height:120px}
  #q:focus{outline:none;border-color:var(--accent)}
  #send{border:none;background:var(--accent);color:#fff;padding:0 18px;border-radius:11px;
    font-weight:600;cursor:pointer} #send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Ассистент разработчика</h1>
  <span class="sub">проект <b>learning-journal</b> · спрашивайте про код, документацию и git</span>
  <div class="legend">
    <span><i class="dot rag"></i>документация</span>
    <span><i class="dot mcp"></i>git (MCP)</span>
    <span><i class="dot sys"></i>файлы</span>
  </div>
</header>

<div id="chat"><div class="wrap" id="stream"></div></div>

<footer>
  <div class="inbar">
    <textarea id="q" rows="1" placeholder="Спросите о проекте… (Enter — отправить, Shift+Enter — перенос)"></textarea>
    <button id="send">Спросить</button>
  </div>
</footer>

<script>
const stream = document.getElementById('stream');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
const history = [];

const ICON = {
  rag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/></svg>',
  mcp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="8" r="2.4"/><path d="M6 8.4v7.2M8.4 6H14a3 3 0 0 1 3 3v-.5"/></svg>',
  sys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>'
};

// ── компактный markdown → HTML (self-contained, без внешних библиотек) ──
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,(_,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<i>$1</i>');
}
function md(src){
  const lines = src.replace(/\r/g,'').split('\n');
  let html='', i=0, guard=0;
  while(i<lines.length){
    if(++guard > 20000) break;               // страховка: разбор всегда конечен
    let ln=lines[i];
    if(ln.startsWith('```')){                       // блок кода
      const lang=ln.slice(3); i++; let buf=[];
      while(i<lines.length && !lines[i].startsWith('```')){buf.push(lines[i]); i++;}
      i++; html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head=ln.split('|').slice(1,-1).map(c=>c.trim());
      i+=2; let body=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        body.push(lines[i].split('|').slice(1,-1).map(c=>c.trim())); i++;
      }
      html+='<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    let m;
    if(m=ln.match(/^(#{1,3})\s+(.*)$/)){html+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>'; i++; continue;}
    if(/^\s*(---|\*\*\*)\s*$/.test(ln)){html+='<hr>'; i++; continue;}
    if(/^\s*>\s?/.test(ln)){
      let buf=[]; while(i<lines.length && /^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;}
      html+='<blockquote>'+md(buf.join('\n'))+'</blockquote>'; continue;
    }
    if(/^\s*[-*]\s+/.test(ln)){
      let buf=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++;}
      html+='<ul>'+buf.join('')+'</ul>'; continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      let buf=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){buf.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++;}
      html+='<ol>'+buf.join('')+'</ol>'; continue;
    }
    if(ln.trim()===''){i++; continue;}
    // абзац — последняя ветка: ВСЕГДА съедаем текущую строку и шагаем (i++ обязателен,
    // иначе строки, начинающиеся с ** , зацикливали разбор до нехватки памяти).
    let buf=[lines[i]]; i++;
    const stop=/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>\s|```|\s*\|.*\|)/;
    while(i<lines.length && lines[i].trim()!=='' && !stop.test(lines[i])){buf.push(lines[i]); i++;}
    html+='<p>'+inline(buf.join(' '))+'</p>';
  }
  return html;
}

function scrollDown(){document.getElementById('chat').scrollTop=1e9;}

function addUser(text){
  const row=document.createElement('div'); row.className='row user wrap';
  row.innerHTML='<div class="bubble">'+esc(text).replace(/\n/g,'<br>')+'</div>';
  stream.appendChild(row); scrollDown();
}
function traceHtml(trace){
  if(!trace||!trace.length) return '';
  const seen=new Set(); let pills='';
  trace.forEach(t=>{
    const arg = t.args && (t.args.query||t.args.pattern||t.args.relpath||t.args.subdir||'');
    pills += '<span class="pill '+t.kind+'">'+ICON[t.kind]+t.label+
      (arg?' <span class="arg">'+esc(String(arg).slice(0,32))+'</span>':'')+'</span>';
  });
  return '<div class="trace">'+pills+'</div>';
}
function addBot(res){
  const row=document.createElement('div'); row.className='row bot wrap';
  let body;
  try{ body=md(res.answer||''); }         // ошибка отрисовки не должна ронять ответ
  catch(e){ body='<p>'+esc(res.answer||'')+'</p>'; }
  row.innerHTML = traceHtml(res.trace)+'<div class="bubble"><div class="md">'+body+'</div>'+
    '<div class="meta">модель: '+(res.provider||'—')+'</div></div>';
  stream.appendChild(row); scrollDown();
}
function addTyping(){
  const row=document.createElement('div'); row.className='row bot wrap'; row.id='typing';
  row.innerHTML='<div class="bubble"><span class="typing">думаю<i></i><i></i><i></i></span></div>';
  stream.appendChild(row); scrollDown(); return row;
}

async function ask(text){
  addUser(text); history.push({role:'user',content:text});
  qEl.value=''; qEl.style.height='auto'; sendBtn.disabled=true;
  const typing=addTyping();
  let res;
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:text,history})});
    res=await r.json();
  }catch(e){ res={answer:'Не удалось связаться с сервером: '+e,trace:[],provider:'none'}; }
  typing.remove(); addBot(res);                 // отрисовка вне try — её сбой не маскируется под «ошибку связи»
  if(res.answer) history.push({role:'assistant',content:res.answer});
  sendBtn.disabled=false; qEl.focus();
}

// стартовый экран с примерами вопросов
function welcome(){
  const row=document.createElement('div'); row.className='row bot wrap';
  row.innerHTML='<div class="bubble"><div class="md">'+md(
    'Привет. Я знаю проект **learning-journal**: его документацию, весь код и git.\n\n'+
    'Спросите, например:')+'</div><div class="chips" id="chips"></div></div>';
  stream.appendChild(row);
  const qs=['Что это за проект, если коротко?','Чем занимались на прошлой неделе?',
    'Что меняли в проекте последним?','Зачем в проекте нужен RAG?'];
  const c=row.querySelector('#chips');
  qs.forEach(t=>{const b=document.createElement('div'); b.className='chip'; b.textContent=t;
    b.onclick=()=>ask(t); c.appendChild(b);});
}

qEl.addEventListener('input',()=>{qEl.style.height='auto'; qEl.style.height=Math.min(qEl.scrollHeight,120)+'px';});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); if(qEl.value.trim())ask(qEl.value.trim());}});
sendBtn.onclick=()=>{if(qEl.value.trim())ask(qEl.value.trim());};
welcome(); qEl.focus();
</script>
</body>
</html>
