<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День 25 — мини-чат RAG + память задачи</title>
<style>
  :root{
    --bg:#141312; --panel:#1c1b19; --panel2:#232220; --ink:#ececec; --muted:#928e86;
    --line:#302d29; --accent:#6ba7ff; --accentbg:#1b2c44; --userbg:#2a3f5f;
    --ok:#57c98a; --okbg:#12301f; --warn:#d8b64a; --warnbg:#2e2708; --bad:#e8776e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .app{display:flex;flex-direction:column;height:100vh;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .prov{font-size:12px;color:var(--muted)}
  header .sp{flex:1}
  .rst{border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .rst:hover{color:var(--ink)}
  main{flex:1;display:flex;min-height:0}
  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .stream{flex:1;overflow-y:auto;padding:20px 20px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:76%;display:flex;flex-direction:column;gap:6px}
  .msg.u{align-self:flex-end;align-items:flex-end}
  .msg.b{align-self:flex-start}
  .bubble{padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
  .u .bubble{background:var(--userbg);border-bottom-right-radius:5px}
  .b .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
  .rew{font-size:12px;color:var(--muted);font-style:italic;padding:0 4px}
  .chip{font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:20px;align-self:flex-start}
  .c-abst{background:var(--warnbg);color:var(--warn)}
  .c-bad{background:#3a1512;color:var(--bad)}
  .src{font-size:12.5px;color:var(--muted)}
  .src summary{cursor:pointer;list-style:none;user-select:none;color:var(--accent)}
  .src summary::-webkit-details-marker{display:none}
  .src summary:hover{text-decoration:underline}
  .src .q{margin:6px 0 0;padding:8px 11px;background:var(--panel2);border-left:2px solid var(--accent);
    border-radius:6px;font-style:italic;color:#cfc9c0}
  .composer{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
  .composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 15px;font:inherit;color:var(--ink);outline:none}
  .composer input:focus{border-color:var(--accent)}
  .composer button{border:0;border-radius:12px;padding:0 20px;font:inherit;font-weight:650;
    background:var(--accent);color:#0c1626;cursor:pointer}
  .composer button:disabled{opacity:.45;cursor:default}
  /* карточка задачи */
  aside{width:320px;flex:none;border-left:1px solid var(--line);padding:18px 18px;overflow-y:auto}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
  aside .hint{font-size:12px;color:var(--muted);margin:0 0 16px}
  .field{margin:0 0 16px}
  .field .lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
  .field .val{font-size:14px}
  .goal{background:var(--accentbg);border:1px solid #24425f;border-radius:10px;padding:10px 12px}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;margin:0 6px 6px 0;font-size:13px}
  .pill.new{animation:pop .5s ease}
  @keyframes pop{0%{background:var(--okbg);border-color:var(--ok)}100%{background:var(--panel2)}}
  .empty{color:var(--muted);font-size:13px}
  @media (max-width:820px){ aside{display:none} .msg{max-width:88%} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ассистент по родительству</h1>
    <span class="prov" id="prov">…</span>
    <span class="sp"></span>
    <button class="rst" id="rst">Новый диалог</button>
  </header>
  <main>
    <div class="chat">
      <div class="stream" id="stream"></div>
      <div class="composer">
        <input id="inp" placeholder="Спросите про сон и беспокойство младенца…" autocomplete="off">
        <button id="send">→</button>
      </div>
    </div>
    <aside>
      <h2>Карточка задачи</h2>
      <p class="hint">Что ассистент удерживает в памяти на весь диалог. Обновляется точечно после каждого хода.</p>
      <div class="field">
        <div class="lab">Цель диалога</div>
        <div class="val goal" id="c-goal"><span class="empty">пока не задана</span></div>
      </div>
      <div class="field">
        <div class="lab">Уточнено пользователем</div>
        <div class="val" id="c-clar"><span class="empty">—</span></div>
      </div>
      <div class="field">
        <div class="lab">Ограничения и термины</div>
        <div class="val" id="c-cons"><span class="empty">—</span></div>
      </div>
    </aside>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const SID = "web";
let prevClar = new Set(), prevCons = new Set();

fetch('/health').then(r=>r.json()).then(h=> $('#prov').textContent = h.provider+' · '+h.model);

function addUser(text){
  const m = document.createElement('div'); m.className='msg u';
  m.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  $('#stream').appendChild(m); scroll();
}
function addThinking(){
  const m = document.createElement('div'); m.className='msg b'; m.id='thinking';
  m.innerHTML = `<div class="bubble muted" style="color:var(--muted)">…</div>`;
  $('#stream').appendChild(m); scroll(); return m;
}
function statusChip(t){
  if(t.abstained) return `<span class="chip c-abst">нет ответа в источниках</span>`;
  if(t.status==='unverifiable') return `<span class="chip c-bad">не подтверждено ссылкой</span>`;
  return '';
}
function addBot(t){
  $('#thinking')?.remove();
  const m = document.createElement('div'); m.className='msg b';
  let html = '';
  if(t.rewritten) html += `<div class="rew">искали как: ${esc(t.standalone)}</div>`;
  const chip = statusChip(t);
  if(chip) html += chip;
  html += `<div class="bubble">${esc(t.answer)}</div>`;
  if(t.citations && t.citations.length){
    const qs = t.citations.map(c=>`<div class="q">«${esc(c.quote)}»</div>`).join('');
    html += `<details class="src"><summary>источники · ${t.citations.length}</summary>${qs}</details>`;
  }
  m.innerHTML = html;
  $('#stream').appendChild(m); scroll();
}
function scroll(){ const s=$('#stream'); s.scrollTop = s.scrollHeight; }

function renderCard(st){
  $('#c-goal').innerHTML = st.goal ? esc(st.goal) : '<span class="empty">пока не задана</span>';
  const fill = (id, arr, prev) => {
    const box = $(id);
    if(!arr || !arr.length){ box.innerHTML = '<span class="empty">—</span>'; return new Set(); }
    box.innerHTML = arr.map(x=>{
      const isNew = !prev.has(x);
      return `<span class="pill${isNew?' new':''}">${esc(x)}</span>`;
    }).join('');
    return new Set(arr);
  };
  prevClar = fill('#c-clar', st.clarified, prevClar);
  prevCons = fill('#c-cons', st.constraints, prevCons);
}

async function send(){
  const text = $('#inp').value.trim();
  if(!text) return;
  $('#inp').value=''; $('#send').disabled=true; $('#inp').disabled=true;
  addUser(text); addThinking();
  try{
    const t = await (await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, session_id:SID})})).json();
    addBot(t); renderCard(t.task_state);
  }catch(e){
    $('#thinking')?.remove();
    const m=document.createElement('div'); m.className='msg b';
    m.innerHTML=`<div class="bubble" style="color:var(--bad)">Ошибка: ${esc(''+e)}</div>`;
    $('#stream').appendChild(m);
  }
  $('#send').disabled=false; $('#inp').disabled=false; $('#inp').focus();
}

$('#send').onclick = send;
$('#inp').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
$('#rst').onclick = async ()=>{
  await fetch('/reset',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:SID})});
  $('#stream').innerHTML=''; prevClar=new Set(); prevCons=new Set();
  renderCard({goal:'',clarified:[],constraints:[]});
  $('#inp').focus();
};
$('#inp').focus();
</script>
</body>
</html>
