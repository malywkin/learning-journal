<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агент с памятью · День 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1d1f; --muted:#86868b; --line:#e7e7e4; --bg:#ffffff;
    --panel:#fbfbf9; --accent:#0071e3; --user:#f3f5f7;
    --green:#34c759; --green-ink:#0f7a37;
    --serif:"Source Serif 4", Charter, Georgia, "Times New Roman", serif;
    --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, sans-serif;
    --mono:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
    font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* ── шапка ── */
  header{display:flex;align-items:baseline;gap:16px;padding:24px 40px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-weight:600;font-size:26px;letter-spacing:-.015em}
  header .sub{font-family:var(--sans);color:var(--muted);font-size:13.5px}
  header .spacer{flex:1}
  .btn{font-family:var(--sans);font-size:14px;line-height:1;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:9px 15px;border-radius:980px;transition:.15s}
  .btn:hover{border-color:#c7c7cc;background:#fafafa}
  /* сегмент-переключатель хранилища */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:980px;overflow:hidden;font-family:var(--sans);font-size:13px}
  .seg button{border:0;background:#fff;color:var(--muted);padding:8px 15px;cursor:pointer;font-weight:600}
  .seg button.on{background:var(--ink);color:#fff}
  /* ── баннер загрузки (доказательство персиста) ── */
  .banner{font-family:var(--sans);font-size:14.5px;padding:11px 40px;display:flex;align-items:center;gap:9px;
    border-bottom:1px solid var(--line);background:#fbfbf9;color:var(--muted)}
  .banner.loaded{background:#e9faef;color:var(--green-ink)}
  .banner .dot{width:9px;height:9px;border-radius:50%;background:#c7c7cc;flex:none}
  .banner.loaded .dot{background:var(--green)}
  .banner b{font-weight:600}
  /* ── раскладка ── */
  .wrap{display:flex;height:calc(100vh - 79px - 43px)}
  .col-chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .transcript{flex:1;overflow:auto;padding:26px 40px}
  .empty{max-width:560px;margin:8vh auto 0;text-align:center;color:var(--muted);font-size:18px;line-height:1.55}
  .msg{margin:0 auto 22px;max-width:680px}
  .msg .who{font-family:var(--sans);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .msg.user .bubble{background:var(--user);border-radius:16px;padding:12px 16px;display:inline-block}
  .msg.bot .bubble{padding:0}
  .bubble{white-space:pre-wrap;word-wrap:break-word}
  .composer{display:flex;gap:12px;align-items:flex-end;padding:15px 40px;border-top:1px solid var(--line)}
  textarea#input{flex:1;font-family:var(--serif);font-size:18px;line-height:1.4;border:1px solid var(--line);
    border-radius:16px;padding:13px 16px;resize:none;max-height:160px;outline:none;color:var(--ink)}
  textarea#input:focus{border-color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:#0063c8}
  /* ── панель «Память на диске» ── */
  .col-disk{width:42%;max-width:560px;border-left:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:24px 28px;font-family:var(--sans)}
  .col-disk h2{font-family:var(--sans);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
  .col-disk .file{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
  pre.json{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#1d1d1f;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word;margin:0}
  table.ledger{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.ledger th,table.ledger td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
  table.ledger th{background:#f4f4f1;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-top:0}
  table.ledger td.id{color:var(--muted);width:34px}
  table.ledger td.role{width:78px;color:var(--accent)}
  .note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
  <header>
    <h1>Агент с памятью</h1>
    <span class="sub">День 7 · контекст переживает перезапуск</span>
    <span class="spacer"></span>
    <span class="seg" id="seg">
      <button data-store="json" class="on">JSON-файл</button>
      <button data-store="sqlite">SQLite</button>
    </span>
    <button class="btn" id="clear">Стереть память</button>
  </header>

  <!-- баннер: сколько поднято с диска при старте сервера -->
  <div class="banner" id="banner"><span class="dot"></span><span id="bannerText">…</span></div>

  <div class="wrap">
    <div class="col-chat">
      <div class="transcript" id="transcript"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Напишите сообщение…  (Enter — отправить)"></textarea>
        <button class="btn btn-primary" id="send">Отправить</button>
      </div>
    </div>

    <aside class="col-disk">
      <h2>💾 Память на диске</h2>
      <div class="file" id="diskFile">memory.json</div>
      <div id="diskBody"></div>
      <div class="note">Это содержимое читается <b>заново с диска</b> при каждом ответе.
        Остановите сервер и запустите снова — обновите страницу: разговор поднимется отсюда.</div>
    </aside>
  </div>

<script>
  const $ = s => document.querySelector(s);
  const transcript = $("#transcript");
  let store = "json";

  function addMsg(who, text){
    const m = document.createElement("div");
    m.className = "msg " + (who === "user" ? "user" : "bot");
    const w = document.createElement("div"); w.className = "who";
    w.textContent = who === "user" ? "Вы" : "Ассистент";
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
    m.appendChild(w); m.appendChild(b);
    transcript.appendChild(m);
    transcript.scrollTop = transcript.scrollHeight;
    return b;
  }

  function renderTranscript(history){
    transcript.innerHTML = "";
    if(!history.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "Память пуста — новый разговор.<br>Скажите что-нибудь «на память» (например, ваше имя или клиента), потом перезапустите сервер.";
      transcript.appendChild(e);
      return;
    }
    history.forEach(m => addMsg(m.role === "user" ? "user" : "bot", m.content));
  }

  function renderBanner(loaded){
    const b = $("#banner"), t = $("#bannerText");
    if(loaded > 0){
      b.classList.add("loaded");
      t.innerHTML = "✓ При запуске сервера загружено <b>" + loaded + "</b> сообщений с диска — продолжаем разговор.";
    }else{
      b.classList.remove("loaded");
      t.innerHTML = "Память пуста — это новый разговор (на диске пока ничего нет).";
    }
  }

  function renderDisk(disk, storeName){
    $("#diskFile").textContent = storeName === "json" ? "memory.json" : "memory.db  ·  таблица messages";
    const body = $("#diskBody");
    if(disk.kind === "json"){
      const pre = document.createElement("pre"); pre.className = "json";
      pre.textContent = disk.text;
      body.innerHTML = ""; body.appendChild(pre);
    }else{
      if(!disk.rows.length){
        body.innerHTML = '<pre class="json">[ таблица пуста ]</pre>'; return;
      }
      let html = '<table class="ledger"><tr><th>№</th><th>кто</th><th>что сказал</th></tr>';
      disk.rows.forEach(r => {
        html += '<tr><td class="id">' + r.id + '</td><td class="role">' +
          (r.role === "user" ? "ты" : "модель") + '</td><td>' + escapeHtml(r.content) + '</td></tr>';
      });
      body.innerHTML = html + '</table>';
    }
  }
  function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function applyState(st){
    store = st.store;
    renderTranscript(st.history);
    renderBanner(st.loaded);
    renderDisk(st.disk, st.store);
    document.querySelectorAll("#seg button").forEach(btn =>
      btn.classList.toggle("on", btn.dataset.store === st.store));
  }

  // При загрузке страницы — забрать состояние с сервера (то, что поднято с диска).
  fetch("/api/state").then(r => r.json()).then(applyState);

  async function send(){
    const input = $("#input");
    const text = input.value.trim();
    if(!text) return;
    addMsg("user", text);
    input.value = ""; autoGrow(input);
    const bubble = addMsg("bot", "…");
    try{
      const r = await fetch("/api/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ message: text })
      });
      const data = await r.json();
      bubble.textContent = data.reply;
      renderDisk(data.disk, data.store);     // обновляем панель «на диске»
      renderBanner(data.loaded);
    }catch(e){ bubble.textContent = "[ошибка сети: " + e + "]"; }
  }
  function autoGrow(t){ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

  $("#send").onclick = send;
  $("#input").addEventListener("input", e => autoGrow(e.target));
  $("#input").addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  document.querySelectorAll("#seg button").forEach(btn => btn.onclick = async () => {
    const r = await fetch("/api/store", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ store: btn.dataset.store })
    });
    applyState(await r.json());
  });
  $("#clear").onclick = async () => {
    applyState(await (await fetch("/api/clear", { method:"POST" })).json());
  };
</script>
</body>
</html>
