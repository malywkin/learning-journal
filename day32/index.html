<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-ревьюер кода — День 32</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --edge:#30363d;
    --tx:#e6edf3; --dim:#8b949e; --blue:#58a6ff;
    --green:#3fb950; --amber:#d29922; --red:#f85149;
    --add:#3fb950; --del:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 60px;}
  h1{font-size:20px;font-weight:600;margin:0 0 3px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 20px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  textarea{width:100%;height:230px;resize:vertical;background:#0b0f16;color:#d7e0ea;
    border:1px solid var(--edge);border-radius:10px;padding:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  button{border:1px solid var(--edge);border-radius:9px;padding:9px 16px;font-size:13.5px;
    cursor:pointer;background:#21262d;color:var(--tx)}
  button.primary{background:#238636;border-color:#2ea043;font-weight:600}
  button.primary:hover{background:#2ea043}
  button:hover{background:#2a3038}
  button:disabled{opacity:.5;cursor:default}
  .pr{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px}
  .pr input{width:70px;background:#0b0f16;border:1px solid var(--edge);border-radius:8px;
    color:var(--tx);padding:7px 9px;font-size:13px}
  #out{display:none}
  .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
  .b-approve{background:rgba(63,185,80,.15);color:var(--green);border:1px solid var(--green)}
  .b-comment{background:rgba(210,153,34,.15);color:var(--amber);border:1px solid var(--amber)}
  .b-changes{background:rgba(248,81,73,.15);color:var(--red);border:1px solid var(--red)}
  .summary{margin:12px 0 4px;line-height:1.55}
  .files{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .chip{background:var(--card2);border:1px solid var(--edge);border-radius:6px;
    padding:3px 9px;font-size:12px;font-family:ui-monospace,monospace;color:#9db0c9}
  .sec{margin-top:16px}
  .sec h3{font-size:14px;margin:0 0 8px;color:var(--tx)}
  .sec.bugs h3{color:#ff9a94}
  .sec.arch h3{color:#d2a8ff}
  .sec.rec h3{color:#7ee2a8}
  .sec ul{margin:0;padding-left:20px}
  .sec li{margin:5px 0;line-height:1.5;color:#c9d4e0}
  .prov{margin-top:18px;color:var(--dim);font-size:12px;border-top:1px solid var(--edge);padding-top:12px}
  .err{color:var(--red)}
  .muted{color:var(--dim)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);
    border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI-ревьюер кода</h1>
  <p class="sub">То же ревью, что робот сам делает на PR (День 32), только в руках: положи сюда изменения (diff) или укажи номер PR — увидишь баги, архитектурные замечания и рекомендации. Мотор общий с Днём 31.</p>

  <div class="card">
    <label>Изменения (diff)</label>
    <textarea id="diff" placeholder="Вставь сюда diff — «было/стало» построчно…"></textarea>
    <div class="row">
      <button class="primary" id="go">Проверить</button>
      <button id="sample">Загрузить образец</button>
      <span class="pr">или PR&nbsp;#<input id="pr" placeholder="1" inputmode="numeric"><button id="goPr">Взять с GitHub</button></span>
    </div>
  </div>

  <div class="card" id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function loadSample(){
  const r = await fetch('/sample'); const j = await r.json();
  $('diff').value = j.diff || '';
}

function section(cls, title, items){
  items = (items || []).filter(x => String(x).trim());
  if(!items.length) return '';
  return `<div class="sec ${cls}"><h3>${title}</h3><ul>${
    items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
}

function render(d){
  const out = $('out'); out.style.display = 'block';
  if(d.error){ out.innerHTML = `<span class="err">${esc(d.error)}</span>`; return; }
  const v = d.verdict || 'comment';
  const badge = v === 'approve' ? ['b-approve','можно мержить']
              : v === 'request_changes' ? ['b-changes','нужны правки']
              : ['b-comment','есть замечания'];
  const files = (d._files || []).map(f => `<span class="chip">${esc(f)}</span>`).join('');
  out.innerHTML = `
    <span class="badge ${badge[0]}">${badge[1]}</span>
    ${files ? `<div class="files">${files}</div>` : ''}
    <div class="summary">${esc(d.summary || '')}</div>
    ${section('bugs','Потенциальные баги', d.bugs)}
    ${section('arch','Архитектурные проблемы', d.architecture)}
    ${section('rec','Рекомендации', d.recommendations)}
    <div class="prov">Проверил: ${esc(d._provider || '—')}. Это рекомендация, не запрет на мерж.</div>`;
}

async function run(byPr){
  const btn = byPr ? $('goPr') : $('go');
  const body = byPr ? { pr: $('pr').value.trim() } : { diff: $('diff').value };
  if(byPr && !body.pr){ return; }
  if(!byPr && !body.diff.trim()){ return; }
  btn.disabled = true;
  $('out').style.display = 'block';
  $('out').innerHTML = '<span class="muted"><span class="spinner"></span> робот читает изменения, сверяет с правилами проекта и пишет ревью…</span>';
  try{
    const r = await fetch('/review', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    render(await r.json());
  }catch(e){ render({error:'ошибка связи с сервером: ' + e}); }
  btn.disabled = false;
}

$('sample').onclick = loadSample;
$('go').onclick = () => run(false);
$('goPr').onclick = () => run(true);
</script>
</body>
</html>
